kind = "web"
previewPath = "/"
title = "Seu Zuca — Marketplace B2B"
version = "1.0.0"
id = "artifacts/seu-zuca"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22122

[services.development]
run = "pnpm --filter @workspace/seu-zuca run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/seu-zuca", "run", "build" ]
publicDir = "artifacts/seu-zuca/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22122"
BASE_PATH = "/"
